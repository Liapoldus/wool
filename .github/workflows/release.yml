name: release

on:
  push:
    tags:
      - "wool-v3.*"
      - "v3.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module and tests
        run: |
          test "$(sed -n '1p' go.mod)" = "module github.com/Liapoldus/wool/v3"
          go test ./...
          go vet ./...
      - name: Package source artifact
        id: release_version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#wool-}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          artifact="wool-${version}.tar.gz"
          git archive --format=tar --prefix="wool-${version}/" "${GITHUB_SHA}" | gzip -n > "${artifact}"
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: wool-${{ steps.release_version.outputs.version }}.sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Sign release artifact and SBOM
        env:
          WOOL_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          artifact="wool-${WOOL_VERSION}.tar.gz"
          sbom="wool-${WOOL_VERSION}.sbom.spdx.json"
          cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "${sbom}"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: wool-*.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            wool-*
